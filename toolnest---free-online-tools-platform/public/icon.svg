<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="80" y="80" width="352" height="352" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- ToolNest Emblem -->
  <g filter="url(#shadow)">
    <!-- Outer hexagon nest / tool badge -->
    <path d="M256 128 L380 200 V344 L256 416 L132 344 V200 Z" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
    <!-- Wrench / Screwdriver / Compass cross motif -->
    <path d="M200 200 L312 312 M312 200 L200 312" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" />
    <!-- Center core nesting dot -->
    <circle cx="256" cy="256" r="32" fill="#ffffff" />
    <circle cx="256" cy="256" r="16" fill="#2563eb" />
  </g>
</svg>
